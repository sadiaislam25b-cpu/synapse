name: Refresh news and papers

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - run: |
          node -e "console.log(process.version)"
          curl -sS -o /dev/null -w "guardian: %{http_code}\n" https://content.guardianapis.com
          curl -sS -o /dev/null -w "arxiv: %{http_code}\n" https://export.arxiv.org
          node -e "fetch('https://content.guardianapis.com').then(r => console.log('node fetch status', r.status)).catch(e => console.log('node fetch error', e))"

      - run: node fetchNews.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}

      - run: node fetchPapers.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
