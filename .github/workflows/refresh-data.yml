name: Refresh news and papers

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - run: |
          getent hosts ep-blue-night-b8v5470e.c-14.us-east-1.aws.neon.tech || echo "getent failed"
          node -e "require('dns').promises.lookup('ep-blue-night-b8v5470e.c-14.us-east-1.aws.neon.tech').then(a => console.log('node dns lookup ok', a)).catch(e => console.log('node dns lookup failed', e.code))"

      - run: node fetchNews.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}

      - run: node fetchPapers.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
